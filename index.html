<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сортировка магазинов гипермаркета по ШО и этажу</title>
  <link rel="shortcut icon" href="css/images/giper.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <h2>Сортировка магазинов гипермаркета по ШО и этажу 🏬</h2>
  
  <div class="container">
    <textarea id="input" placeholder="Введите номера магазинов через запятую, пробел или с новой строки..."></textarea>
  
    <div class="buttons">
      <button onclick="sortBySHO()">Отсортировать</button>
      <button onclick="copyResult()">Скопировать</button>
      <button class="clear-btn" onclick="clearInput()">Очистить</button>
    </div>
  
    <div class="result" id="output"></div>
  
    <div class="links">
      <!-- Модальное окно со слайдером -->
<div id="floorModal" class="modal">
  <span class="close" onclick="closeModal()">×</span>
  
  <div class="slider-container">
    <div class="slides">
      <div class="slide">
        <img src="css/images/basement.jpg" alt="Подвал">
        <div class="caption">Подвал</div>
      </div>
      
      <div class="slide">
        <img src="css/images/floor1.jpg" alt="1 этаж">
        <div class="caption">1-й этаж</div>
      </div>
      
      <div class="slide">
        <img src="css/images/floor2.jpg" alt="2 этаж">
        <div class="caption">2-й этаж</div>
      </div>
    </div>

    <button class="prev" onclick="changeSlide(-1)">❮</button>
    <button class="next" onclick="changeSlide(1)">❯</button>
  </div>
</div>
      <a href="gipermarket.pdf" download>Скачать PDF</a>
    </div>
  </div>

</body>
</html>
