
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сортировка магазинов гипермаркета по ШО и этажу</title>
    
    <!-- Иконка вкладки (если есть) -->
    <link rel="icon" href="css/images/giper.jpg" type="image/jpeg">
    
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Сортировка магазинов гипермаркета по ШО и этажу</h1>

    <div class="container">
        <textarea id="input" rows="5" placeholder="Введите номера магазинов / ШО через запятую, пробел или перенос строки"></textarea>

        <div class="buttons">
            <button onclick="sortBySHO()">Отсортировать</button>
            <button onclick="copyResult()">Скопировать результат</button>
            <div class="clear-btn" onclick="clearInput()">Очистить</div>
        </div>

        <div class="result" id="output"></div>

        <div class="links">
            <p>Планировки этажей:</p>
            <a href="css/images/basement.jpg"   target="_blank">→ Подвал</a><br>
            <a href="css/images/floor1.jpg"     target="_blank">→ 1 этаж</a><br>
            <a href="css/images/floor2.jpg"     target="_blank">→ 2 этаж</a>
            <br><br>
            <a href="gipermarket.pdf" download>Скачать PDF со схемой (все этажи)</a>
        </div>
    </div>

</body>
</html>
